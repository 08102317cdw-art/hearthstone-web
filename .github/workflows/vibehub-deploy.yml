name: Build and deploy to VibeHub

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vibehub-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Agent: replace this block after detecting the repository's package manager and build script.
      - name: Build static site
        run: |
          true

      - name: Install verified VibeHub CLI
        if: github.event_name == 'push'
        run: |
          installer="$(mktemp)"
          curl -fsSL --retry 3 https://vibe.lumigrav.space/downloads/vibehub-cli/install.sh -o "$installer"
          sh "$installer"
          rm -f "$installer"

      - name: Create concise release note
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[0] | select(.)' \
              2>/dev/null || true
          )"
          if [ -n "$pr_json" ]; then
            number="$(printf '%s' "$pr_json" | jq -r '.number')"
            head_ref="$(printf '%s' "$pr_json" | jq -r '.head.ref')"
            title="$(printf '%s' "$pr_json" | jq -r '.title')"
            body="$(printf '%s' "$pr_json" | jq -r '.body // empty')"
            {
              printf 'PR #%s · %s · %s\n' "$number" "$head_ref" "$title"
              if [ -n "$body" ]; then
                printf '\n%s\n' "$body" | head -c 2000
              fi
            } > "$RUNNER_TEMP/vibehub-release-note.txt"
          else
            commit_title="$(git log -1 --pretty=%s)"
            printf '直接推送 · %s\n' "${commit_title:0:1000}" > "$RUNNER_TEMP/vibehub-release-note.txt"
          fi

      - name: Publish built files
        if: github.event_name == 'push'
        env:
          VIBEHUB_TOKEN: ${{ secrets.VIBEHUB_PROJECT_TOKEN }}
        run: |
          "$HOME/.local/bin/vibehub" update \
            --slug W6OOXn9b \
            --dir . \
            --note-file "$RUNNER_TEMP/vibehub-release-note.txt"
