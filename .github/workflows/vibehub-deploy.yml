name: Build and deploy to VibeHub

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vibehub-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Agent: replace this block after detecting the repository's package manager and build script.
      - name: Build static site
        run: |
          true

      # 判断本次改动是否涉及游戏内容。
      # 约定:游戏内容 = 仓库根目录的静态文件(index.html、*.js 等);
      # 子目录(docs/.github/.vibehub/参考文档/酒馆战棋模式等)与根目录已知非游戏文件
      # (CLAUDE.md/README.md/.gitignore)视为非游戏,不触发部署,避免内部文档污染游戏简介。
      - name: Detect game content changes
        id: changes
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${EVENT_BEFORE:-HEAD~1}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
          echo "本次改动文件:"
          echo "$changed" | sed 's/^/  /'
          non_game="CLAUDE.md README.md .gitignore"
          game="false"
          for f in $changed; do
            [ -z "$f" ] && continue
            case "$f" in
              *"/"*) continue ;;        # 子目录文件 → 非游戏
            esac
            case " $non_game " in
              *" $f "*) continue ;;     # 根目录已知非游戏文件
            esac
            game="true"
            break
          done
          echo "game=$game"
          echo "game=$game" >> "$GITHUB_OUTPUT"

      - name: Skip notice for non-game changes
        if: github.event_name == 'push' && steps.changes.outputs.game == 'false'
        run: echo "本次改动仅涉及文档/CI 等非游戏文件,跳过 VibeHub 部署"

      - name: Install verified VibeHub CLI
        if: github.event_name == 'push' && steps.changes.outputs.game == 'true'
        run: |
          installer="$(mktemp)"
          curl -fsSL --retry 3 https://vibe.lumigrav.space/downloads/vibehub-cli/install.sh -o "$installer"
          sh "$installer"
          rm -f "$installer"

      - name: Create concise release note
        if: github.event_name == 'push' && steps.changes.outputs.game == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[0] | select(.)' \
              2>/dev/null || true
          )"
          if [ -n "$pr_json" ]; then
            number="$(printf '%s' "$pr_json" | jq -r '.number')"
            head_ref="$(printf '%s' "$pr_json" | jq -r '.head.ref')"
            title="$(printf '%s' "$pr_json" | jq -r '.title')"
            body="$(printf '%s' "$pr_json" | jq -r '.body // empty')"
            {
              printf 'PR #%s · %s · %s\n' "$number" "$head_ref" "$title"
              if [ -n "$body" ]; then
                printf '\n%s\n' "$body" | head -c 2000
              fi
            } > "$RUNNER_TEMP/vibehub-release-note.txt"
          else
            commit_title="$(git log -1 --pretty=%s)"
            printf '直接推送 · %s\n' "${commit_title:0:1000}" > "$RUNNER_TEMP/vibehub-release-note.txt"
          fi

      - name: Publish built files
        if: github.event_name == 'push' && steps.changes.outputs.game == 'true'
        env:
          VIBEHUB_TOKEN: ${{ secrets.VIBEHUB_PROJECT_TOKEN }}
        run: |
          "$HOME/.local/bin/vibehub" update \
            --slug W6OOXn9b \
            --dir . \
            --note-file "$RUNNER_TEMP/vibehub-release-note.txt"
